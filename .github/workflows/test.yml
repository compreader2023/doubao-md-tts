name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --no-deps -e .
      - run: python -m unittest discover -s tests -v
      - name: Test macOS launchers
        if: runner.os == 'macOS'
        run: |
          ./setup.sh
          ./tts.sh examples/sample.md --dry-run
      - name: Test Windows launchers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          setup.bat
          tts.bat examples\sample.md --dry-run
